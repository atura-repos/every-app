name: Atura Gateway and CLI Release
# A manually approved release from an existing Atura tag. No Cloudflare credentials
# or deployment: production rollout is a separate, verified operator action.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag: atura-gateway-v<semver> (e.g. atura-gateway-v0.3.0-atura.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'atura-repos/every-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: |
          case "$TAG" in
            atura-gateway-v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Expected atura-gateway-v<semver>' >&2; exit 1 ;;
          esac
      - name: Checkout the tagged source (full history for release ordering)
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag points to Atura main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git tag --points-at HEAD | grep -Fx "$TAG")" = "$TAG"
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.18.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build SDK, CLI, and Gateway
        run: |
          pnpm -C packages/sdk build
          pnpm -C packages/cli build
          pnpm -C apps/every-app-gateway build
      - name: Check types and built CLI
        run: |
          pnpm types:check
          pnpm -C packages/cli test:built
      - name: Pack immutable release assets
        run: |
          set -euo pipefail
          version="${TAG#atura-gateway-v}"
          pnpm -C apps/every-app-gateway build:release -- --skip-build --version "$version"
          mkdir -p release-assets
          cp apps/every-app-gateway/every-app-gateway-release.tar.gz release-assets/
          pnpm -C packages/cli pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
          (cd release-assets && shasum -a 256 * > SHA256SUMS)
      - name: Publish only to Atura GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refusing to overwrite immutable assets" >&2
            exit 1
          fi
          gh release create "$TAG" release-assets/* \
            --verify-tag --prerelease --title "Atura Gateway and CLI $TAG" \
            --notes "Built from $GITHUB_SHA in atura-repos/every-app. Deploy explicitly with the Atura checkout or the Gateway tarball. This workflow never deploys to Cloudflare."
